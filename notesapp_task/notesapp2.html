<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doc</title>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Elegant Notes</h1>
            <p>store your thoughts and ideas in style</p>
        </header>
        <div class="controls">
            <div class="" controls-container">
                <input type="text" id="SearchInput" Placeholder="Search notes" class="search-input" />
                <div class="filter-group">
                    <select id="" filterSelect" class="filter-select">
                        <option value="all">All notes</option>
                        <options value="work">Work</options>
                        <options value="personal">Personal</options>
                        <options value="ideas">Ideas</options>
                        <option value="remainders">Reminders</option>
                    </select>
                    <button id="addnotebtn" class="add-btn">
                        <i class="fas fa-plus"></i>Add
                    </button>
                </div>
            </div>
        </div>
        <div id="" notescontainer" class="notes-grid">
        </div>
        <div id="emptystate" class="empty-state">
            <i class="" fas fa-notes-medical"></i>
            <h3>No Notes</h3>
            <p>Add your first note by clicking the ADD button</p>
        </div>
        <div id="addNoteModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3> class="modal-title">New Note</h3>
                    <button id="closeModalBtn" class="modal-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <form id="noteForm" class="modal-body">
                <div class="form-group">
                    <label for="noteTitle" class="form-label">Title</label>
                    <input type="text" id="noteTitle" class="form-input" required />
                </div>
                <div class="form-group">
                    <label for="noteContent" class="form-label">Content</label>
                    <textarea id="noteContent" class="form-input form-textarea" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Tags</label>
                    <div class="tags-Container">
                        <label class="tag-option">
                            <input type="radio" name="noteTag" value="work" class="tag_radio" />
                            <span class="tag-label tag-work">
                                <i class="fas fa-briefcase"></i>Work
                            </span>
                        </label>
                        <label class="tag-option">

                        </label>
                        <label class="tag-option">

                        </label>
                        <label class="tag-option">

                        </label>
                    </div>
                </div>
                <div id="confirmModal" class="modal-overlay">
                    <div class="modal confirmation-modal">
                        <div class="modal-body">
                            <p class="confirmation_text">
                                Are you Sure you want to delete this note?
                            </p>
                            <div class="confirmation-buttons">
                                <button id="canceldeleteBtn" class="confirmation-Btn cancel-btn">
                                    cancel
                                </button>
                                <button id="confirmDeleteBtn" class="confirmation-btn confirm-btn">delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>





</html>
