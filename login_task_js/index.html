<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login and register</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h2 class="logo">Logo</h2>
        <nav class="navigation">
            <a href="homep.html" target="_blank">Home</a>
            <a href="aboutp.html" target="_blank">About</a>
            <a href="#"target="_blank">Services</a>
            <a href="#">Contact</a>
            <button class="btn-loginpopup">Login</button>


        </nav>






    </header>
    <div class="wrapper">
        <span class="icon-close">
            <ion-icon name="close-outline"></ion-icon>



        </span>






        <div id="logg" class="form-box login">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><span class="icon"><ion-icon name="mail-outline"></ion-icon></span></span>
                    <input type="email" id="login-email" required>
                    <label>Email</label>
                </div><br>
                <div class="input-box">
                    <span class="icon"><span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span></span>
                    <input type="password" id="login-pass" required>
                    <label>Password</label>
                </div><br><br>
                <div class="remember-forgot">
                    <label><input type="checkbox">Remember me</label>
                    <a href="#">Forgot password?</a>
                </div><br>


                <button type="submit" class="btn" id="login-btn">Login</button><br>

                <div class="login-register">
                    <p>Don't have an account? <a href="#" class="register-link">Register</a></p>





                </div>
            </form>
        </div>
        <div id="regg" class="form-box register">
            <h2>Register</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><span class="icon"><ion-icon name="people-outline"></ion-icon></span></span>
                    <input type="text" id="reg-user" required>
                    <label>Username</label>
                </div><br>
                <div class="input-box">
                    <span class="icon"><span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span></span>
                    <input type="password" id = "reg-pass" required>
                    <label>Password</label>
                </div><br><br>
                <div class="remember-forgot">
                    <label><input type="checkbox">I agree to t&c </label>

                </div><br>


                <button type="submit" class="btn" id="reg-btn">Register</button><br>

                <div class="login-register">
                    <p>already have an account? <a href="#" class="login-link">Login</a></p>





                </div>
            </form>
        </div>






    </div>









    <script src="login.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>



</html>
