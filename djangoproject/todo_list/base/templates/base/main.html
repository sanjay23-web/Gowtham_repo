<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">


</head>

<style>
    body {
        background-color:#FAFAFA;
        font-family: "Nunito", sans-serif;
        padding-top: 50px;
    }
    h1,
    h2,
    h3
    {
        font-family: 'Raleway', sans-serif;
    }

    a,
    p {
        color: #4b5156;
    }

    .header-bar {
        display: flex;
        justify-content: space-between;
        color: #fff;
        padding: 10px;
        border-radius: 5px 5px 0 0;
        background: linear-gradient(90deg, #eea390 0%, #eb796f 43%, #eb796f 100%);
       
    }
    .header-bar a {
        text-decoration: none;
    }

    .task-wrapper {
        display:flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        background-color: aliceblue;
        border-top: 1px solid whitesmoke;
    }

    .task-title {
        display: flex;
    }
    .task-title a {
        text-decoration: none;
        color: #4b5156;
        margin-left: 10px;
    }
    .task-complete-icon {
        height: 20px;
        width: 20px;
        background-color: rgb(4, 170, 54);
        border-radius: 50%;
    }
    .task-incomplete-icon {
        height: 20px;
        width: 20px;
        background-color: rgb(225, 209, 209);
        border-radius: 50%;
    }

    .delete-link {
        text-decoration: none;
        font-weight: 900;
        color: black;
        font-size: 22px;
        line-height: 0;
    }

    #search-add-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
    }

    #add-link {
        color: black;
        text-decoration: none;
        font-size: 42px;
        text-shadow: 1px 1px black;
    }

    input[type=text],
    input[type=password],
    textarea {
        border: 1px solid black;
        border-radius: 5px;
        padding: 10px;
        width: 90%;
    }

    label {
        padding-top: 10px !important;
        display: block;

    }

    .button {
        border: 1px solid black;
        background-color: white;
        padding: 10px;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
    }

    .card-body {
        padding: 20px;
    }
    











    .container {
        max-width: 550px;
        margin: auto;
        background-color: #f6f1f1d3;
       
        border-radius: 20px;
        box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.2);
    }
</style>
<body>
    <div class="container">
        {% block content %}

        {% endblock content %}

    </div>




    
</body>
</html>
