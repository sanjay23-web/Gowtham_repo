<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django basics</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container pt-5">
        <div class="card mx-auto" style="width: 18rem;">
            <img class="card-img-top" src="{{ employee.photo.url }}" alt="Employee profile">
            <div class="card-body">
                <p class="card-text">{{ employee.first_name }} {{ employee.last_name }}</p>
                <p class="card-text">{{ employee.designation }} </p>
                <p class="card-text">{{ employee.email_address }} </p>
                <p class="card-text">{{ employee.phone_number }} </p>
            </div>
            <a href="{% url 'home' %}" class="btn btn-primary">Back to home</a>

        </div>





    </div>


    <!-- Bootstrap JS (Optional, but good to have) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
